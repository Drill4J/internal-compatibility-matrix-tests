name: Matrix Tests

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  download-agents:
    runs-on: ${{ matrix.os }}
    env:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 17.0
          distribution: corretto
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Download Drill4J Agents
        # This step loads Drill4J agents for one task; results for other tasks are cached
        run: gradle :tests:async:executor-service:drillDownloadAgents --info
      - name: List .drill files
        run: ls ~/.drill/agents
      - name: Upload .drill folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: drill-agents-${{ matrix.os }}
          path: ~/.drill/agents
          if-no-files-found: error
  tests:
    needs: download-agents
    runs-on: ${{ matrix.mode == 'java-mode' && 'ubuntu-latest' || matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [ubuntu-latest, windows-latest, macos-14, java-mode]
        java-version: [8, 11, 17, 21, 25]
    steps:
      - name: Download .drill folder
        uses: actions/download-artifact@v4
        with:
          name: drill-agents-${{ matrix.mode == 'java-mode' && 'ubuntu-latest' || matrix.mode }}
          path: ~/.drill/agents

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17.0
          distribution: corretto

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set-up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run tests using Gradle Wrapper
        run: ./gradlew test -PjavaVersion=${{ matrix.java-version }} ${{ matrix.mode == 'java-mode' && '-PdrillAgentMode=JAVA' || '' }} --info --no-daemon --refresh-dependencies

      - name: Test Report (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (matrix.mode == 'ubuntu-latest' || matrix.mode == 'java-mode') && (success() || failure())
        with:
          check_name: Test Report (${{ matrix.mode }}, java-${{ matrix.java-version }})
          files: |
            tests/**/build/test-results/test/TEST-*.xml

      - name: Test Report (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows/bash@v2
        if: matrix.mode == 'windows-latest' && (success() || failure())
        with:
          check_name: Test Report (${{ matrix.mode }}, java-${{ matrix.java-version }})
          files: |
            tests\**\build\test-results\test\TEST-*.xml                      

      - name: Test Report (MacOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: matrix.mode == 'macos-14' && (success() || failure())
        with:
          check_name: Test Report (${{ matrix.mode }}, java-${{ matrix.java-version }})
          files: |
            tests/**/build/test-results/test/TEST-*.xml

      - name: Upload native errors
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-errors-${{ matrix.mode }}-java${{ matrix.java-version }}
          path: tests/**/hs_err_*.log
