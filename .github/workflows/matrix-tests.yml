name: Matrix Tests

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  download-agents:
    runs-on: ${{ matrix.os }}
    env:
      GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: 17.0
          distribution: corretto
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
      - name: Download Drill4J Agents
        # This step loads Drill4J agents for one task; results for other tasks are cached
        run: gradle :tests:async:executor-service:drillDownloadAgents --info
      - name: List .drill files
        run: ls ~/.drill/agents
      - name: Upload .drill folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: drill-agents-${{ matrix.os }}
          path: ~/.drill/agents
          if-no-files-found: error
  tests:
    needs: download-agents
    runs-on: ${{ matrix.mode == 'java-mode' && 'ubuntu-latest' || matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [ubuntu-latest, windows-latest, macos-14, java-mode]
        java-version: [8, 11, 17, 21, 25]
    steps:
      - name: Download .drill folder
        uses: actions/download-artifact@v4
        with:
          name: drill-agents-${{ matrix.mode == 'java-mode' && 'ubuntu-latest' || matrix.mode }}
          path: ~/.drill/agents

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17.0
          distribution: corretto

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set-up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run tests using Gradle Wrapper
        run: ./gradlew test -PjavaVersion=${{ matrix.java-version }} ${{ matrix.mode == 'java-mode' && '-PdrillAgentMode=JAVA' || '' }} --info --no-daemon --refresh-dependencies

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.mode }}-java-${{ matrix.java-version }}
          path: tests/**/build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

      - name: Upload native errors
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-errors-${{ matrix.mode }}-java${{ matrix.java-version }}
          path: tests/**/hs_err_*.log

  generate-report:
    needs: tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: all-test-results

      - name: Generate compatibility matrix report
        run: |
          chmod +x .github/scripts/generate-report.sh
          .github/scripts/generate-report.sh all-test-results | tee compatibility-matrix.md >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-matrix-report
          path: compatibility-matrix.md

